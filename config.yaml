# POC3 (policy run) - MinerU + Qwen3-VL-8B on policy documents, three input
# modalities, each document split into page windows, scored per field against a
# golden canonical JSON, and timed: MinerU per document and per page, model
# latency per document and per case.
#
# Every relative path resolves against the directory holding this file.
#
# The case comparison is only valid if NOTHING differs between the three cases
# except the modality paragraph and the shape of the user turn. Do not add
# per-case overrides to `inference`, `prompt` or `chunking` - that is how a
# benchmark starts measuring its own harness.
#
# The original 2-model x 3-case run over ACORD forms, loss runs and policy
# declarations is commit a57bc38 on main.

project:
  name: poc3-policy-8b-windows
  run_id: null                 # null -> UTC timestamp at start; set a string to resume a run

paths:
  input_dir: input/policy
  # The common canonical schema every line of business shares. Each LOB has its
  # own schema; the two are resolved into ONE schema per LOB
  # (src/schema_resolver.py) and that resolved schema drives the prompt, the
  # validation and the scoring. null = each LOB schema is used on its own.
  common_schema: input/policy/schema/common_model.json
  # Fallback only, for a LOB folder with no schema of its own.
  schema: null
  work_dir: work
  ocr_dir: work/ocr_policies
  resolved_schema_dir: work/schemas
  output_dir: output_policies
  report_dir: output_policies/report
  system_prompt: prompts/system_prompt.txt
  # The notes added to the user turn when a document is split into windows:
  # which pages this request carries, what the reference pages are, and the
  # digest of what earlier windows extracted.
  window_prompt: prompts/window.txt
  window_reference_prompt: prompts/window_reference.txt
  window_context_prompt: prompts/window_context.txt
  # The modality paragraph: what inputs this case supplies. Varies by case ONLY.
  case_prompts:
    pdf_only: prompts/case_pdf_only.txt
    pdf_md:   prompts/case_pdf_md.txt
    md_only:  prompts/case_md_only.txt
  # The user-turn preamble for each case.
  user_prompts:
    pdf_only: prompts/user_pdf_only.txt
    pdf_md:   prompts/user_pdf_md.txt
    md_only:  prompts/user_md_only.txt

# Every document in this run is a policy. Two layouts for its lines of business:
#   manifest - input/policy/{pdfs,gold,schema} plus input/policy/manifest.json,
#              which lists every document with its PDF, gold JSON, LOB and LOB
#              schema. Nothing is paired by name. (This run.)
#   folders  - leave `manifest` unset: each folder directly under input_dir is
#              one LOB, holding its schema, PDFs and gold JSONs.
lobs:
  manifest: input/policy/manifest.json
  doc_type_name: Policy
  prompt: prompts/doctype/policy.txt   # the policy paragraph every LOB shares
  # Optional extra paragraph per LOB: prompts/lob/<lob id>.txt, where the id is
  # the folder name lower-cased with non-alphanumerics as "_" ("Commercial
  # Auto" -> commercial_auto). Absent file = no extra paragraph.
  lob_prompt_dir: prompts/lob
  names: {}                            # optional display names: {commercial_auto: "Commercial Auto"}

schema_resolution:
  # How the common schema's top-level fields join a LOB schema:
  #   auto   - merge them in, unless the LOB schema already includes the whole
  #            common schema (a $ref to the file itself, typically in allOf)
  #   always - always merge them in
  #   never  - the LOB schema is used as written; only its $refs are resolved
  merge_common_root: auto

corpus:
  # The run: 5 policies spanning 8-111 pages (null = every document in the manifest).
  documents: [endorsement_capi056240, inmrc, health_main, policy_01, bop]
  require_gold: false          # extraction + timing only: a gold file is not needed
  # Stripped from a file stem when pairing a PDF with its gold JSON.
  gold_suffixes: [extraction, extracted, gold, golden, groundtruth, gt,
                  expected, label, labels, labelled, labeled, annotation,
                  annotations, canonical, json]

pod:
  id: "peuwpamzad828w"
  proxy_template: "https://{pod_id}-{port}.proxy.runpod.net"
  # The RunPod proxy is public - anyone with the pod id can reach these ports -
  # so both servers require a key. It is read from the environment rather than
  # written here, because this file is committed. On the provisioned pod it is
  # API_KEY in /workspace/serve.conf (one key for vLLM and mineru-api):
  #     $env:POC3_API_KEY = "<API_KEY from serve.conf>"      (PowerShell)
  api_key: "${POC3_API_KEY}"
  ocr_api_key: "${POC3_API_KEY}"   # Bearer to mineru-api (X-POC3-Key to pod/mineru_server.py)
  verify_tls: true

# As served by the provisioned pod (/workspace/svc-vl.sh + serve.conf). The
# pod's own values are authoritative; preflight --pod checks them against these.
models:
  - tag: 8B
    model_id: Qwen/Qwen3-VL-8B-Instruct
    served_name: Qwen3-VL-8B-Instruct   # serve.conf VL_NAME
    port: 8000                 # serve.conf VL_PORT
    max_model_len: 131072      # serve.conf VL_LEN - must be raised from 65536 to this:
                               # the largest window (~62k prompt) + a 32k answer
    max_images: 16             # serve.conf VL_LIMIT_MM; >= window_pages +
                               # section_boundaries.max_shift_pages + len(anchor_pages) = 13
    # Unset = through the RunPod proxy (from a laptop). On the pod itself
    # pod/run_all.sh sets POC3_VL_BASE_URL=http://127.0.0.1:8000, so the run
    # needs no proxy, no internet and no laptop.
    base_url: "${POC3_VL_BASE_URL:-}"

cases: [md_only, pdf_only, pdf_md]

# On-disk folder names. Internal ids stay slugs; these are what you read.
# Output layout is  output_policies/<model tag>/<case>/<LOB folder>/<doc>.json
case_dir_names:
  pdf_only: "PDF only"
  pdf_md:   "PDF+MD"
  md_only:  "MD only"

# Every document is split into page windows; each window is one request and the
# window outputs are merged into one canonical JSON (src/chunking.py). The same
# windows are used for all three cases, so the case comparison is unaffected.
chunking:
  window_pages: 10             # pages per request. A document this short or shorter is one request.
  overlap_pages: 1             # pages repeated at the start of the next window, so a schedule
                               # that runs across a window boundary is seen whole at least once
  concurrency: 1               # windows of one document in flight at once. Forced to 1 while
                               # context.carry_forward is on: each window needs the one before it.
  # Two windows giving DIFFERENT values for the same single field: keep the one
  # from the earlier window (first) or the later one (last). The declarations
  # page usually comes first. Every conflict is listed in the cell's meta.json.
  scalar_conflict: first
  # Safety net: a window's values whose page_ref / page_range lies entirely
  # outside the window's pages did not come from it (a copy), and are dropped
  # before the merge. The count is recorded per window in meta.json.
  drop_out_of_window: true
  # Context from outside a window. BOTH ARE OFF, on evidence: tested on BOP
  # pages 31-38 (policy wording, MD only), a window given the declarations page
  # and/or a digest of earlier windows wrote declarations data instead of its
  # own pages - copied (up to 145 of 151 values not from the window, 19,064
  # tokens, 334s) or invented and labelled with a window page. Given only its
  # own pages it wrote nothing that is not on them (5,044 tokens, 110s).
  # Overlap and section-aware boundaries (below) still carry context safely.
  context:
    # Pages shown at the start of every window that does not contain them, as
    # reference only. [] = off.
    anchor_pages: []
    # Give each window a digest of what earlier windows extracted. Off.
    carry_forward: false
    digest_max_chars: 6000     # cap on the digest (~1,700 tokens)
    digest_max_items: 40       # entities listed per list before "... and N more"
  # Move each window boundary by up to max_shift_pages so the next window starts
  # where a new section starts (a heading at the top of a page) rather than in
  # the middle of a table. Planned once per document from MinerU's markdown -
  # so MinerU runs even when only PDF only is requested - and the same plan is
  # used by all three cases. PDF only never sees the markdown itself.
  section_boundaries:
    enabled: true
    max_shift_pages: 2

render:
  dpi: 200
  max_long_side_px: 1024       # ~800 image tokens/page on Qwen3-VL's 32px grid
  archive_format: png          # what lands in work/ocr_policies (lossless, stable hash)
  wire_format: jpeg            # what is base64'd into the request (small)
  jpeg_quality: 88
  max_total_payload_mb: 24     # HARD refusal above this, per request (per window)

ocr:
  # mineru_api - MinerU 4's own API (mineru-api, /v1/tasks) - the provisioned pod
  # pod        - this repo's pod/mineru_server.py around the MinerU 2.x CLI
  # pymupdf    - embedded text layer only (dry runs; a scan has none)
  mode: mineru_api
  port: 8001                   # serve.conf MINERU_PORT
  base_url: "${POC3_OCR_BASE_URL:-}"   # on the pod: http://127.0.0.1:8001 (pod/run_all.sh)
  # MinerU 4 parse quality: flash (text layer only - useless on scans) | basic |
  # standard | advanced. On the 4-page homeowners scan, advanced split headers
  # and table captions more finely and ran in 5.2s vs 38.4s for standard (the
  # first call, possibly warm-up). Changing it re-runs MinerU: cached markdown
  # records its tier and is never reused across tiers.
  tier: advanced
  ocr_mode: ocr                # auto | txt | ocr - every PDF here is a scan
  gpu_label: "NVIDIA RTX PRO 6000 Blackwell Server Edition"   # mineru-api does not report it
  backend: pipeline            # pod mode only: MinerU 2.x backend
  lang: en                     # pod mode only
  device: cuda                 # pod mode only
  keep_discarded_blocks: true  # pod mode only (mineru_api: headers/footers are always kept)
  poll_interval_s: 1           # finer polling = a tighter client-side time; the pod's own
                               # processing time is measured on the pod regardless
  job_timeout_s: 3600          # a 90-page scan can take several minutes
  upload_timeout_s: 300
  cache: true                  # reuse work/ocr_policies/<doc_id>/page_N.md if present
  fallback_to_pymupdf: false   # true only for dry runs; a scan has no text layer

inference:
  stream: true                 # MANDATORY: the RunPod proxy kills requests idle >100s
  allow_nonstream: false
  temperature: 0.0
  top_p: 1.0
  seed: 0
  # Output budget per window when budget_from_gold is false (and the fallback for
  # a document with no gold when it is true).
  max_tokens: 32768
  # The output budget is derived from the gold for THIS document - one number
  # per document, identical across its windows and its three cases. A window
  # emits at most the whole document's answer, so the whole-document budget is
  # always enough for a window.
  # false = every window may write up to max_tokens (above), with no gold involved.
  # A window stops as soon as its JSON is complete, so a large ceiling costs
  # nothing; it only prevents cut-off answers.
  budget_from_gold: false
  chars_per_token: 3.77        # measured on pretty-printed canonical JSON
  budget_margin: 1.6           # models emit nulls, repeated keys and whitespace the gold does not
  budget_floor: 16384          # the budget may only rise above this, never fall below
  budget_ceiling: 32768        # largest window prompt (~40k) + this stays under max_model_len
  include_usage: true
  connect_timeout_s: 30
  first_byte_timeout_s: 240    # prefill of a full window with images
  inter_chunk_timeout_s: 120   # a slow stretch of decoding must not read as a stall
  total_timeout_s: 1800
  retries: 2
  retry_backoff_s: 10
  retry_on_length: true        # one retry at max_tokens*1.5 if finish_reason == "length"
  extra_body: {}               # escape hatch for vLLM-only params

prompt:
  schema_style: both           # json | outline | both
  max_md_chars_per_page: 20000
  truncate_md_notice: "...[page markdown truncated]"

scoring:
  # false = extraction + timing only: no F1/precision/recall, no score files, no
  # accuracy report; gold files are not read. true = score every cell vs its gold.
  enabled: false
  primary_metric: field_f1
  auto_entity_lists: true      # any unlisted list-of-dicts aligns by value similarity
  # list path -> ordered identity-key attempts. Each attempt is an AND-group of
  # fields; a key is used only when it is unique on BOTH sides, so a weaker key
  # is tried next rather than cross-pairing. Paths use [] for "each item of that
  # list", e.g. coverage_parts[].coverages.
  #
  # The same keys are used when merging window outputs: two windows reporting
  # the same entity (an overlap page, or a vehicle listed on the declarations
  # and again on a schedule) are recognised by these keys first, then by
  # agreeing values.
  #
  # Tune against the REAL gold: `python src/selftest.py --gold <file>` and its
  # assertion 4 (list reversal) names any list that still fails. The entries
  # below were tuned on the earlier policy schemas and are harmless where a
  # path does not exist.
  entity_lists:
    forms_endorsements:                            [[form.form_number_full, limit.raw_text], [form.form_number_full, premium.raw_text], [coverage_name, limit.raw_text]]
    forms_and_endorsements.forms:                  [[form_number_full], [form_number, edition]]
    policy_coverages:                              [[coverage_code], [coverage_name]]
    policy_coverages[].limit.components:           [[qualifier], [amount]]
    discounts_surcharges:                          [[name], [name, loc_bldg]]
    property_characteristics:                      [[loc_bldg]]
    property_characteristics[].attributes:         [[name], [name, value]]
    special_interests:                             [[name], [interest_type, name]]
    locations:                                     [[location_number], [address_verbatim]]
    locations.entries:                             [[location_number], [address_verbatim]]
    policy_conditions:                             [[text_verbatim]]
    properties:                                    [[property_number], [property_label_verbatim]]
    properties[].coverages:                        [[coverage_name, section], [coverage_name]]
    rating_information:                            [[subject], [subject, property_label]]
    rating_information[].attributes:               [[name], [name, value]]
    vehicles:                                      [[vehicle_number], [vin]]
    vehicle_coverages:                             [[attribute]]
    vehicle_coverages[].values:                    [[vehicle_number]]
    additional_vehicle_information:                [[attribute]]
    additional_vehicle_information[].values:       [[vehicle_number]]
    vehicle_discounts:                             [[attribute]]
    vehicle_discounts[].values:                    [[vehicle_number]]
    vehicle_usage:                                 [[vehicle_number]]
    vehicle_garaging:                              [[vehicle_number]]
    additional_interests:                          [[vehicle_number, interest_type], [name]]
    drivers:                                       [[driver_number], [name]]
    insurance_scores:                              [[name, ordered_date], [ordered_date]]
    general_policy_information:                    [[field]]
    manual_losses:                                 [[date, description], [date]]
    violations:                                    [[driver_number, date], [date]]
    exceptions:                                    [[level, type], [type]]
    remarks.sections:                              [[heading], [text]]
    coverage_parts[].coverages:                    [[coverage_name], [form.form_number_full], [coverage_name, limit.raw_text]]
    coverage_parts[].coverages[].attributes:       [[name], [name, value.raw_text]]
    coverage_parts[].coverages[].attributes[].value.components: [[qualifier], [amount]]
    coverage_parts[].blanket_limits:               [[name]]
    coverage_parts[].other_forms:                  [[form_number_full], [form_number, edition]]
    common_forms:                                  [[form_number_full], [form_name]]
    locations[].valuation:                         [[property_type], [basis]]
    policy.policy_period.exceptions:               [[jurisdiction]]
    premium_summary.components:                    [[description], [category, description]]
    footnotes:                                     [[marker], [text]]
    contact_info.entries:                          [[type], [information]]
    coverage_parts:                                [[part_name]]
    coverage_parts[].locations:                    [[location_label]]
    coverage_parts[].locations[].rated_items:      [[item_type]]
    coverage_parts[].locations[].rated_items[].attributes: [[name], [name, value]]
    coverage_parts[].locations[].rated_items[].coverages:  [[coverage_name]]
    extraction_meta.validation_flags:              [[code, pointer], [code], [message]]
    extraction_meta.unresolved_fields:             [[pointer], [reason]]
  # Identifier-named fields stay strings: a form number "10 18" must not be read
  # as 1018, and "SC 00 01" must not be case-folded into a number.
  identifier_key_regex: "(number|naic|zip|postal|vin|license|code|account|territory|sequence|certificate|identifier|marker|edition|form_|_key$|_id$|_no$)"
  date_key_regex: "(date|dated|expiry|expiration|effective|inception|birth|printed_on|issued)"
  absent_strings: ["", "n/a", "na", "none", "null", "-", "--", "nil",
                   "not stated", "not provided"]
  # Facts about the EXTRACTION rather than about the document. A model cannot
  # produce these truthfully, so scoring them docks every cell equally for
  # something that says nothing about extraction quality.
  ignore_paths:
    - extraction_meta.schema_version
    - extraction_meta.source_file
  # The same, by field NAME wherever it occurs. This canonical model wraps every
  # value as {raw, parsed, confidence: {score, source}, page_ref, flagged}; in
  # the gold, confidence and flagged are the gold pipeline's own bookkeeping
  # ("source": "deterministic") and fideon:provenance records who drafted the
  # gold. Scored, they were 21-41% of every document's leaves.
  ignore_keys: [confidence, flagged, "fideon:provenance"]
  # A wrapper's value, for identity keys and the window digest: parsed, else raw.
  value_keys: [parsed, raw]
  # WHERE a value is printed. Part of the document, so scored - but as its own
  # "page_references" score, not in field_f1, and never used to decide that two
  # windows saw the same entity (the same coverage on page 1 and page 10).
  page_ref_keys: [page_ref, page_range]
  # Whole top-level sections scored on their own rather than in field_f1.
  # text_sections is a section index of the whole policy text: 64-78% of the
  # leaves of BOP, INMRC and policy_01, and would otherwise drown the values.
  separate_sections: [text_sections]
  # Objects keyed by generated ids ("FORM 01 23|12 Example Road|") are scored
  # as lists matched by content: no model reproduces such a key exactly.
  keyed_maps: [text_sections]
  coverage_report: true
  strict_score: true

report:
  formats: [json, md, csv]
  top_missing_fields: 40

runtime:
  mock: false
  mock_profile: degraded       # perfect | degraded | truncated | garbage
  overwrite: false             # false = skip a cell (and a window) that already has output (resume)
  fail_fast: false
  log_level: INFO
